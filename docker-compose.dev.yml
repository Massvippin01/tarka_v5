# ==============================================================================
# SENTINELX - LOCAL DEVELOPMENT COMPOSE TOPOLOGY (docker-compose.dev.yml)
# ==============================================================================
# Optimized for local developer workflow, rapid iteration, and reproducibility.
#
# NOTE ON APPLICATION INTEGRATIONS (Wave 6 Phased Plan):
# - PostgreSQL:    CONTAINER PRESENT | INTEGRATION = NOT YET IMPLEMENTED (Phase 3)
# - Neo4j:         CONTAINER PRESENT | INTEGRATION = PARTIALLY IMPLEMENTED (Phase 3)
# - OpenSearch:    CONTAINER PRESENT | INTEGRATION = NOT YET IMPLEMENTED (Phase 5)
# - MinIO (S3):    CONTAINER PRESENT | INTEGRATION = NOT YET IMPLEMENTED (Phase 4)
# - OPA:           CONTAINER PRESENT | INTEGRATION = NOT YET IMPLEMENTED (Phase 6)
# - Redis:         CONTAINER PRESENT | INTEGRATION = NOT YET IMPLEMENTED (Phase 7)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx_dev_secret}
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelx_user} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-dev-net

  neo4j:
    image: neo4j:5.20-community
    container_name: sentinelx-dev-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/sentinelx_dev_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_dev_data:/data
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - sentinelx-dev-net

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: sentinelx-dev-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch_dev_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - sentinelx-dev-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sentinelx-dev-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentinelx_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sentinelx_dev_secret}
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-dev-net

  opa:
    image: openpolicyagent/opa:0.65.0
    container_name: sentinelx-dev-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command: run --server --log-level=info /policies
    volumes:
      - ./opa/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-dev-net

  redis:
    image: redis:7.2-alpine
    container_name: sentinelx-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinelx-dev-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinelx-dev-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-sentinelx_dev_insecure_jwt_secret_key_32chars_min}
      DATABASE_URL: postgresql://sentinelx_user:sentinelx_dev_secret@postgres:5432/sentinelx
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: sentinelx_dev_secret
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: sentinelx_minio
      S3_SECRET_KEY: sentinelx_dev_secret
      S3_BUCKET_NAME: sentinelx-evidence
      OPA_URL: http://opa:8181
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080"
    volumes:
      - ./backend:/app/backend:ro
      - artifact_dev_data:/app/data/storage/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      opa:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-dev-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinelx-dev-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentinelx-dev-net

networks:
  sentinelx-dev-net:
    driver: bridge

volumes:
  pg_dev_data:
  neo4j_dev_data:
  opensearch_dev_data:
  minio_dev_data:
  artifact_dev_data:
