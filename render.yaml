# ==============================================================================
# TARKA x SENTINELX - RENDER BLUEPRINT CONFIGURATION (render.yaml)
# ==============================================================================
# Dual-tier Free Deployment for Public Evaluator Demonstrations (Budget: ₹0)
# Web Service (Backend): 512 MB RAM / 0.1 CPU in Singapore region.
# Static Site (Frontend): Global CDN edge deployment with zero memory overhead.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Forensics Core & API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: tarka-backend
    runtime: python
    region: singapore
    plan: free
    branch: release/tarka-master-transition
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: development
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: filesystem
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:8080
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: DEMO_ADMIN_EMAIL
        value: "admin@tarka.local"
      - key: DEMO_TESTER_EMAIL
        value: "tester@tarka.local"
      - key: WHATSAPP_ENABLED
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. V6 Tactile Skeuomorphic Frontend (Static CDN Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: tarka-frontend
    runtime: static
    region: singapore
    plan: free
    branch: release/tarka-master-transition
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "" # Left empty for relative routing or set to https://tarka-backend.onrender.com
